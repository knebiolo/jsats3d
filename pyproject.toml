[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsats3d"
version = "0.1.0"
description = "Cleaning, multipath filter, clock synchronization, and 3D positioning of JSATS acoustic telemetry data."
readme = "README.md"
authors = [
    { name = "Kevin Nebiolo" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jsats3d*"]
