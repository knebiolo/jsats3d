# Legacy environment for Kevin's jsats3d.py (Dec 2022). Used by scripts/legacy_pipeline.py.
# jsats3d.py needs pandas < 2 (DataFrame.append, positional to_sql) and scikit-learn < 1.1
# (clock_fix passes a one-element array as DBSCAN eps; 1.1+ rejects it). scikit-learn 1.0.2
# supports Python up to 3.10, so tomli reads the run file.
#     conda env create -f environment_legacy.yml
name: jsat_legacy
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pandas=1.5.3
  - numpy=1.23.5
  - scipy=1.9.3
  - scikit-learn=1.0.2
  - matplotlib=3.6
  - openpyxl
  - tomli
