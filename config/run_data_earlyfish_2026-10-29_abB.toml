[dbscan]
run             = false
beacon_receiver = 'ZOI08'
anchor          = 'ZOI03'
start           = '2025-06-15 00:00:00'
end             = '2025-08-06 23:59:59'
output_dir      = ''

[figures]
depth_floor_m        = -16.0
depth_floor_margin_m = 4.0

[outputs]
positions             = true
drag_plots            = true
fish_figures          = true
drag_test_figures     = false
clock_drift_plots     = true
figure_tags           = []
