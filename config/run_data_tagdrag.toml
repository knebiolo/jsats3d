# Run file for the 2025 TAG DRAG test database (short window). Same layout as config/run_data.toml.
# Created 2026-10-02 (project lead decisions): window 2025-06-10 09:00-13:00 (database clock = local PDT),
# anchor ZOI01, water level from TagDrag_WSE.xlsx plus offset, deep-receiver root rule = below-plane root.
# Run from the repo folder:  python scripts/run_data.py config/run_data_tagdrag.toml   (add --dry-run to check)
# A blank value ('' or []) means "not used" / "no filter".

data_format = 'ats'
overwrite = false

[paths]
raw_root        = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\raw_data'
config_xlsx     = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\1_array_metadata\cowlitz_2025_AT_config.xlsx'
gps_csv         = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\4_gps_datasets\master_df_gps.csv'
covariate_csv   = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Master Covariate Table\2025 Master Covariate Table_20251212.csv'
temperature_csv = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Temperature\2025_Temp_String_Data_5min_interpolated.csv'
hobo_dir        = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Tag Drag Period\DD_N'
released_file   = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\3_PTAGIS_datasets\released_v0.csv'
output_db       = 'output\jsats3d_2025_tagdrag_20250610.db'

[selection]
species   = []
# The five test (drag) tags; beacons are always added when tags are filtered.
tags      = ['FFD3', 'FC36', '0B0A', '0AC6', '493F']
# Drag lines 2025-06-10 10:24-11:45; ZOI07-09 installed 08:12, ZOI10 and ZOI01 08:59.
start     = '2025-06-10 09:00:00'
end       = '2025-06-10 13:00:00'
receivers = []

[study]
utc_conv         = -7
bm_elev          = 861.5
bm_elev_units    = 'feet'
output_units     = 'meters'
master_receiver  = 'ZOI08'
# Sync window = this test window.
synch_time_start = '2025-06-10 09:00:00'
synch_time_end   = '2025-06-10 13:00:00'
pulse_rates      = {}

[legacy]
# Steps run one group at a time from inline Python; the full process() run stays off.
run               = false
env               = 'jsat_legacy'
method            = 'KNN'
# In this window ZOI04 (first heard 06-11) and CFD05 (August only) are absent, CFD09 is excluded because
# SR19026 was still at the CFD05 location until about 06-11 12:40, ZOI11 and CFD01 are excluded (PM 2026-09-28).
surface_receivers = ['ZOI05', 'ZOI06', 'ZOI07', 'ZOI08', 'ZOI09', 'ZOI10',
                     'CFD02', 'CFD03', 'CFD04', 'CFD06', 'CFD07', 'CFD08']
deep_receivers    = ['ZOI01', 'ZOI02', 'ZOI03']
receivers_3d      = ['ZOI01', 'ZOI02', 'ZOI03', 'ZOI05', 'ZOI06', 'ZOI07', 'ZOI08', 'ZOI09', 'ZOI10']
receivers_2d      = ['ZOI01', 'ZOI02', 'ZOI03', 'ZOI05', 'ZOI06', 'ZOI07', 'ZOI08', 'ZOI09', 'ZOI10',
                     'CFD02', 'CFD03', 'CFD04', 'CFD06', 'CFD07', 'CFD08']
fixed_z_2d        = ''
# Legacy rule is solution B; for this database the deep-receiver median uses the below-plane root per
# combination (project lead 2026-10-02), applied in the inline step 6 run, not by this field.
deep_solution     = 'B'
study_tags        = []
signal_proxies    = false
work_dir          = ''

[dbscan]
run             = false
beacon_receiver = 'ZOI08'
anchor          = 'ZOI01'
start           = '2025-06-10 09:00:00'
end             = '2025-06-10 13:00:00'
output_dir      = ''
