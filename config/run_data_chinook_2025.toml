# Run file for the 2025 Chinook fish positioning (created 2026-10-19).
# 4 Chinook tags: 0FBD, 041D, 493F, 5F82 (all released from Cispus River to Clear Fork)
# Full deployment period to capture all detections for 2D/3D positioning.
# K: is read only; everything is written to C:.
# Run from the repo folder:  python scripts/run_data.py config/run_data_chinook_2025.toml
# A blank value ('' or []) means "not used" / "no filter".

data_format = 'ats'
overwrite = false

[paths]
raw_root        = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\raw_data'
config_xlsx     = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\1_array_metadata\cowlitz_2025_AT_config.xlsx'
gps_csv         = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\4_gps_datasets\master_df_gps.csv'
covariate_csv   = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Master Covariate Table\2025 Master Covariate Table_20251212.csv'
temperature_csv = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Temperature\2025_Temp_String_Data_5min_interpolated.csv'
hobo_dir        = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\Tag Drag Period\DD_N'
released_file   = 'K:\Jobs\5662\001\Data\DataTrans\2025_Data\CowlitzAT2025_Data_Deliverables\3_PTAGIS_datasets\released_v0.csv'
output_db       = 'output\jsats3d_2025_chinook.db'

[selection]
