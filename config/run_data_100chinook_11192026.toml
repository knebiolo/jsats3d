# 2026-11-19 full-season run, 100 random chinook (PTAGIS released_v0, Species = Chinook, valid 4-hex code; 510
# candidates; pandas sample(100, random_state=20261119)). Settings = run_data_premedian_11192026.toml (10/29 run +
# ZOI11/CFD01), full study window 2025-06-11..09-17, pre-median filter off.
# 2026-11-19 pre-median filter test: exact settings of the 10/29 early-fish run
# (K:\...\2025_output_results\10292026_run, run file run_data_earlyfish_2026-10-28.toml), only paths changed
# (raw data now on C:\jsats_data; output in output\11192026_premedian). Baseline for pre-median filter testing.
# Receiver change vs 10/29: ZOI11 added to surface + 3D, CFD01 added to 3D (project lead 2026-11-19).
# Run file for the 2025 early-fish positioning (created 2026-10-22, PM example-fish request).
# 4 example fish tags: 26E4, 9F8C, 1D5A, B5ED (all released Cispus River -> Clear Fork).
# 1D5A released 2025-06-17, 9F8C/B5ED 2025-06-24 (released_v0); 26E4 absent from
# released_v0 (released earlier? - PM to confirm). Raw scan 2026-10-23: all four present,
# raw times 2025-06-11 .. 2025-08-06 (receiver-local, unclock-corrected), 19 receivers.
# Window 2025-06-15 -> 2025-08-06: covers the full raw detection span (extended beyond
# the original 06-17..07-31 plan so no fate is clipped at the tail).
# K: is read only; everything is written to C:.
# Run from the repo folder:  python scripts/run_data.py config/run_data_earlyfish_2026-10-26.toml
# A blank value ('' or []) means "not used" / "no filter".

data_format = 'ats'
overwrite = true

[paths]
raw_root        = 'C:\jsats_data\raw_data'
config_xlsx     = 'C:\jsats_data\CowlitzAT2025_Data_Deliverables\1_array_metadata\cowlitz_2025_AT_config.xlsx'
gps_csv         = 'C:\jsats_data\CowlitzAT2025_Data_Deliverables\4_gps_datasets\master_df_gps.csv'
covariate_csv   = 'C:\jsats_data\Master Covariate Table\2025 Master Covariate Table_20251212.csv'
temperature_csv = 'C:\jsats_data\Temperature\2025_Temp_String_Data_5min_interpolated.csv'
hobo_dir        = 'C:\jsats_data\Tag Drag Period\DD_N'
released_file   = 'C:\jsats_data\CowlitzAT2025_Data_Deliverables\3_PTAGIS_datasets\released_v0.csv'
output_db       = 'output\11192026_100fish\jsats3d_2025_100chinook.db'

[selection]
species   = []
tags      = ['00F7', '027B', '05DC', '064B', '0B0E', '0C43', '0F8E', '0FAE', '1021', '116E', '1255', '130E', '131D', '155F', '172B', '1A06', '1A92', '22B3', '23C1', '23DA', '23F3', '25AB', '25B7', '2AEC', '2B88', '2C82', '2D27', '326E', '329F', '338A', '3498', '3781', '381C', '39BC', '3DC5', '3DCD', '4272', '4451', '44B7', '45BA', '4636', '483F', '493F', '495D', '49B6', '4CCB', '4D92', '4E4F', '4EC1', '5004', '55A5', '5786', '5939', '5D78', '5F23', '601B', '63C2', '6A52', '6D97', '6DE0', '702F', '7291', '7332', '7393', '74C4', '7B43', '7B64', '8386', '83AE', '84A5', '8B34', '8EB1', '8F3A', '90D2', '9335', '9749', '9977', '99F2', '9F8C', 'A09E', 'A0EC', 'A161', 'A1A0', 'A4F5', 'A57C', 'A752', 'A8CF', 'A963', 'A98D', 'AE0D', 'B347', 'B3A1', 'B4CA', 'B60B', 'B973', 'BFDF', 'C2E5', 'C9BD', 'CA3B', 'D090']
start     = '2025-06-11 00:00:00'
end       = '2025-09-17 23:59:59'
receivers = []

[study]
utc_conv         = -7
bm_elev          = 861.5
bm_elev_units    = 'feet'
output_units     = 'meters'
master_receiver  = 'ZOI08'
synch_time_start = '2025-06-11 00:00:00'
synch_time_end   = '2025-09-17 23:59:59'
# Pulse periods (s), measured 2026-10-23 from the parsed detections (median of
# inter-pulse gaps in [2.5, 4.5] s, pooled over all 20 receivers; p10-p90 within
# 0.02 s for each tag). released_v0.csv carries no pulse-rate column, so these are
# the authoritative source for this build.
pulse_rates      = {}   # filled from the data after indexing (run_data.py, fills missing only)

[legacy]
run               = true
run_2025_pipeline = true   # true = use _2025_pipeline.py, false = use legacy_pipeline.py
env               = 'jsat_legacy'
method            = 'KNN'
surface_receivers = ['ZOI05', 'ZOI06', 'ZOI07', 'ZOI08', 'ZOI09', 'ZOI10', 'ZOI11',
                     'CFD01', 'CFD02', 'CFD03', 'CFD04', 'CFD06', 'CFD07', 'CFD08', 'CFD09']
deep_receivers    = ['ZOI01', 'ZOI02', 'ZOI03']
receivers_3d      = ['ZOI01', 'ZOI02', 'ZOI03', 'ZOI05', 'ZOI06', 'ZOI07', 'ZOI08', 'ZOI09', 'ZOI10',
                     'ZOI11', 'CFD01']   # 2026-11-19: ZOI11 + CFD01 added (project lead); only change from the 10/29 run
receivers_2d      = []
fixed_z_2d        = ''
fixed_z_2d_by_tag = {}
deep_solution     = 'A'
adopt_deep_z      = 'config'  # Field team 2026-10-22: use tape-measured Z for ZOI01-03 (36.6, 40.7, 33.8 ft). Deng3D got 0 solutions here; tape is authoritative.
known_depth_diagnostics = false
deng_surface      = false
positions_dbscan   = true
dbscan_mode        = 'acceleration'
dbscan_eps_m       = 8.0
dbscan_min_samples = 5
dbscan_accel_scale = 5.0
dbscan_depth_weight = 1.0
dbscan_accel_gap_s = 12.0
study_tags        = []
signal_proxies    = true
work_dir          = ''

[dbscan]
run             = false
beacon_receiver = 'ZOI08'
anchor          = 'ZOI03'
start           = '2025-06-11 00:00:00'
end             = '2025-09-17 23:59:59'
output_dir      = ''

# Figure-generator options (scripts/drag_test_figures_2025.py, scripts/fish_figures_2025.py).
# depth_floor_m: Z (m) below which solutions are unphysical (fish cannot be below the bay bottom).
#   Project-specific — set it per deployment from the known bathymetry.
#   When omitted the generators auto-derive it: deepest receiver Z_t minus depth_floor_margin_m.
# This site: deepest measured TOTAL depth 13.3 m (43.5 ft at ZOI02, config workbook); deepest
# hydrophone -12.40 m; -16.0 m = hydrophone + 4 m (chinook 2026-10-21 audit margin).
[figures]
depth_floor_m        = -16.0
depth_floor_margin_m = 4.0
# 100-fish deliverable: only these per-fish figures (fish_positions.csv, fish_qc.csv, spatial SD always written)
fish_products        = ['plan_time', 'depth_time']

# ============================================================================
# Output selection — what to produce during the pipeline run.
# Set to true to enable, false to skip. figure_tags: [] = all study tags.
# ============================================================================
[outputs]
positions             = true    # Deng 3D positions (written to DB)
drag_plots            = true    # Drag GPS vs Deng comparison plots (2025 pipeline only)
fish_figures          = true    # Fish track plots + GIFs + CSVs
drag_test_figures     = false   # Drag test per-ID plots + static holds + QC
clock_drift_plots     = true    # Clock drift PNGs (legacy pipeline only)
figure_tags           = []      # [] = all study tags, or ["26E4", "9F8C"]
