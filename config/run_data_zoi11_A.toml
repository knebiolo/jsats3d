# ZOI11 A/B test — ARM A (WITHOUT ZOI11), created 2026-11-01.
#
# Question: does receiver ZOI11 (on the debris barrier, "Behind debris barrier" in the
# config workbook, lat 46.4664220 lon -122.1084967, 10 ft hydrophone depth, deployed
# 2025-06-10) help position fish near the debris barrier?
#
# Test data: FFD3 test tag static holds
#   - Debris Barrier holds DB-2, DB-3, DB-4, DB-5, DB-1 on 2025-06-11 12:02:36-12:15:12
#     (cowlitz_AT_2025_testing_sheets.xlsx, Forebay_StaticHolds, Zone = "Debris Barrier";
#      no GPS positions were collected for any of the five holds)
#   - Forebay holds FBY-S-1..FBY-S-10 on 2025-06-10 09:58:02-10:20:02 (same sheet,
#      known Lat/Lon per hold) as bonus ground truth in the same area.
#
# Arm A = current production receiver set (no ZOI11 anywhere).
# Arm B = identical + ZOI11 in surface_receivers and receivers_3d
#         (config/run_data_zoi11_B.toml).
#
# Window 2025-06-10 00:00 -> 2025-06-13 23:59 gives clock-sync context around both
# hold days. Raw files: C: OneDrive raw_data, staged as hard links under
# output/zoi11_test/raw_staging (20250610_Receivers_array_testing + 20250618_Receivers,
# 48 files, continuous coverage 2025-06-09/10 -> 06-18 for all 20 target receivers).
# C: drive only. apply_clock_jumps = false (legacy default; both arms identical).
# No algorithm change vs production; this run file only adds the time window and tag.

