# Run file for scripts/run_data.py  (2019 Teknologic data, Nebiolo & Meyer 2021)
#     conda run -n jsat_3d python scripts/run_data.py config/run_data_2019.toml
# The import uses the shared legacy core and the versioned run configuration below.
# Source paths provided by Kevin on 2026-09-29. Raw files remain read-only.

data_format = 'teknologic'
overwrite = false

[paths]
# One subfolder per receiver named by Rec_ID (R01, R02, ...), holding the Teknologic CSV files.
raw_root      = 'K:\Jobs\3870\014\Calcs\Data\Synch_1'
tag_csv       = 'K:\Jobs\3870\014\Calcs\Data\tblTag.csv'                  # Tag_ID, pulseRate, TagType
receiver_csv  = 'K:\Jobs\3870\014\Calcs\Data\tblReceiver_Initial.csv'    # legacy receiver metadata
wsel_csv      = 'K:\Jobs\3870\014\Calcs\Data\tblWSEL.csv'                 # timeStamp, WSEL
temp_csv      = 'K:\Jobs\3870\014\Calcs\Data\tblTemp.csv'                 # meas_dt, location, depth_ft, temp_celcius
output_db     = 'output\cowlitz_2019_synch_1_recreated.db'

[selection]
# Not used for Teknologic: the legacy import keeps every tag inside the sync window.
species   = []
tags      = []
start     = ''
end       = ''
receivers = []

[study]
utc_conv         = -7
bm_elev          = 262.585     # 861.5 ft / 3.28084
bm_elev_units    = 'meters'
output_units     = 'meters'
master_receiver  = 'R05'
synch_time_start = '2018-06-07 13:17:08'   # canonical Synch_1 synchronization start
synch_time_end   = '2019-05-24 12:25:00'

[legacy]
run               = true
# Deprecated: shared run_data.py now executes the preserved workflow in jsat_3d.
env               = 'jsat_legacy'
method            = 'KNN'
# FILL IN from the paper / tblReceiver: surface receivers with surveyed positions, master included.
surface_receivers = ['R04', 'R05', 'R06', 'R07', 'R08', 'R09']
deep_receivers    = ['R01', 'R02', 'R03']
deep_solution     = 'B'
study_tags        = []
signal_proxies    = false   # 2019 Teknologic data has real SNR/NBW
work_dir          = ''

[dbscan]
run = false
